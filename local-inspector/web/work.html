<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业协同 · 质量安全小察</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f4f7f2}main{max-width:1120px;margin:auto;padding:30px 22px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}textarea{min-height:110px;width:100%;box-sizing:border-box}fieldset{border:1px solid #dce5dc;margin:15px 0;border-radius:12px;padding:18px}legend{font-weight:600}label{display:block;margin:12px 0 6px}details{margin:14px 0}summary{cursor:pointer;font-weight:bold;padding:12px 0}.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.block{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#61776b}.notice{background:#fff5dc;padding:14px;border-radius:12px;margin:14px 0}.entry{border-top:1px solid #dde6dd;padding:16px 0}.thumb{width:100px;height:80px;object-fit:cover;border-radius:8px}.error{color:#9d3529}button:disabled{opacity:.5}a{color:#196b51}pre{white-space:pre-wrap}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#183c30;color:white;border-radius:10px;padding:14px;max-width:90vw;z-index:99;display:none}
</style></head><body><div id="work"></div><div id="toast" role="status"></div><script src="/work.js"></script></body></html>
