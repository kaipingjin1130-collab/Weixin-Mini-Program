openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: B模块集成合同（proposed）
  version: 0.1.0
  description: B00本地合同，未实现服务、未与A联调。Bearer传输方案待确认。
