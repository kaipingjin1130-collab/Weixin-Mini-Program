                code: PAYLOAD_TOO_LARGE
                message: Request exceeds byte limit
                details: []
                request_id: req-demo-001
        '422':
          description: Schema or semantic validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VALIDATION_ERROR
                message: Schema or semantic validation failure
                details: []
                request_id: req-demo-001
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: RATE_LIMITED
                message: Rate limited
                details: []
                request_id: req-demo-001
        '503':
          description: Required dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: DEPENDENCY_UNAVAILABLE
                message: Required dependency unavailable
                details: []
                request_id: req-demo-001
        '200':
          description: Answer, insufficient evidence or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeResponse'
              example:
                query_id: 11111111-1111-4111-8111-111111111111
                status: answered
                knowledge_release_id: 22222222-2222-4222-8222-222222222222
                answer_blocks:
                - text: 此为合同演示案例，不构成工程指导。
                  citation_ids:
                  - cite-demo
                checkpoints: []
                cases: []
                citations:
                - citation_id: cite-demo
                  knowledge_revision_id: 11111111-1111-4111-8111-111111111111
                  evidence_id: 22222222-2222-4222-8222-222222222222
                  source_title: 模拟报告
                  locator:
                    page: 1
                  review_status: approved
                missing_conditions: []
                warnings: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeQuery'
            example:
              request_id: req-demo-001
              project_id: project-demo
              task_id: null
              scene_code: lifting_supervision
              question: 本次旁站有哪些历史案例可以参考？
              context:
                object_type: lifting
                stage: preparation
                conditions: {}
              output_types:
              - answer
              - cases
              limit: 5
