- BearerAuth: []
paths:
  /integration/v1/knowledge/query:
    post:
      operationId: queryKnowledge
      x-contract-status: proposed
      responses:
        '400':
          description: Malformed JSON / duplicate keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_JSON
                message: Malformed JSON / duplicate keys
                details: []
                request_id: req-demo-001
        '401':
          description: Missing or invalid identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: UNAUTHENTICATED
                message: Missing or invalid identity
                details: []
                request_id: req-demo-001
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: FORBIDDEN
                message: Insufficient scope
                details: []
                request_id: req-demo-001
        '404':
          description: Resource not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: NOT_FOUND
                message: Resource not available
                details: []
                request_id: req-demo-001
        '409':
          description: Identity, version or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PACKAGE_VERSION_CONFLICT
                message: Identity, version or idempotency conflict
                details: []
                request_id: req-demo-001
