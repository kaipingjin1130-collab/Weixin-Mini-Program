        '200':
          description: Existing receipt returned without new processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskReceipt'
              example:
                receipt_id: 11111111-1111-4111-8111-111111111111
                job_id: 22222222-2222-4222-8222-222222222222
