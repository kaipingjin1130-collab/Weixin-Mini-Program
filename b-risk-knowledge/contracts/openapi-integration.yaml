components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 可信用户或服务令牌；issuer/audience/代用户方式待A确认
  schemas:
    TaskPackage:
      type: object
      properties:
        schema_version:
          const: '1.0'
        producer: &id002
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        package_id: *id002
        task_id: *id002
        package_version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        exported_at: &id003
          type: string
          minLength: 1
          maxLength: 40
          format: date-time
          pattern: (Z|[+-][0-9]{2}:[0-9]{2})$
        project_id: *id002
        org_id: *id002
        scene_code: &id004
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]{0,63}$
        task:
          type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 500
            status:
              type: string
              enum:
              - completed
              - cancelled
              - archived
            started_at:
              anyOf:
              - *id003
              - type: 'null'
            completed_at:
              anyOf:
              - *id003
              - type: 'null'
          required:
          - name
          - status
          - started_at
          - completed_at
          additionalProperties: false
        participants:
          type: array
          items:
            type: object
            properties:
              actor_id: *id002
              role:
                type: string
                minLength: 1
                maxLength: 64
            required:
            - actor_id
            - role
            additionalProperties: false
          minItems: 0
          maxItems: 200
        events:
          type: array
          items:
            type: object
            properties:
              event_id: *id002
              event_type: *id004
              occurred_at:
                anyOf:
                - *id003
                - type: 'null'
              actor_id:
                anyOf:
                - *id002
                - type: 'null'
              actor_role:
                type: string
                minLength: 1
                maxLength: 64
              related_object_id: *id002
              payload:
                type: object
                maxProperties: 64
                additionalProperties: true
              evidence_refs: &id006
                type: array
                items: *id002
                minItems: 0
                maxItems: 1000
                uniqueItems: true
            required:
            - event_id
            - event_type
            - occurred_at
            - actor_id
            - actor_role
            - related_object_id
            - payload
            - evidence_refs
            additionalProperties: false
          minItems: 0
          maxItems: 10000
        issues:
          type: array
          items:
            type: object
            properties:
              issue_id: *id002
              description: &id005
                type: string
                minLength: 1
                maxLength: 20000
              status:
                type: string
                enum:
                - open
                - rectifying
                - pending_review
                - closed
                - unknown
              responsible_actor_id:
                anyOf:
                - *id002
                - type: 'null'
              due_at:
                anyOf:
                - *id003
                - type: 'null'
              rectification:
                anyOf:
                - *id005
                - type: 'null'
              review_conclusion:
                anyOf:
                - *id005
                - type: 'null'
              evidence_refs: *id006
            required:
            - issue_id
            - description
            - status
            - responsible_actor_id
            - due_at
            - rectification
            - review_conclusion
            - evidence_refs
            additionalProperties: false
          minItems: 0
          maxItems: 2000
        attachments:
          type: array
          items:
            type: object
            properties:
              attachment_id: *id002
              sha256:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[0-9a-f]{64}$
              mime_type:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[a-z0-9.+-]+/[a-z0-9.+-]+$
              size:
                type: integer
                minimum: 0
                maximum: 104857600
              evidence_type:
                type: string
                enum:
                - site_photo
                - text_screenshot
                - source_document
                - video
                - other
                - unknown
              access_ref:
                type: object
                properties:
                  connector_id: *id002
                  object_id: *id002
                required:
                - connector_id
                - object_id
                additionalProperties: false
            required:
            - attachment_id
            - sha256
            - mime_type
            - size
            - evidence_type
            - access_ref
            additionalProperties: false
          minItems: 0
          maxItems: 200
        data_completeness:
          type: object
          properties:
            participants: &id007
              type: string
              enum:
              - complete
              - partial
              - missing
              - not_applicable
            events: *id007
            issues: *id007
            attachments: *id007
            event_times: *id007
          required:
          - participants
          - events
          - issues
          - attachments
          - event_times
          additionalProperties: false
        is_demo:
          type: boolean
        extensions:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_.]*$
          additionalProperties: true
      required:
      - schema_version
      - producer
      - package_id
      - task_id
      - package_version
      - exported_at
      - project_id
      - org_id
      - scene_code
      - task
      - participants
      - events
      - issues
      - attachments
      - data_completeness
      - is_demo
      additionalProperties: false
    KnowledgeQuery:
      type: object
      properties:
        request_id: &id008
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        project_id: *id008
        task_id:
          anyOf:
          - *id008
          - type: 'null'
        scene_code: &id009
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]{0,63}$
        question:
          type: string
          minLength: 1
          maxLength: 4000
        context:
          type: object
          properties:
            object_type: *id009
            stage:
              type: string
              enum:
              - preparation
              - execution
              - review
              - training
            conditions:
              type: object
              maxProperties: 32
              propertyNames: *id009
              additionalProperties:
                anyOf:
                - type: string
                  minLength: 0
                  maxLength: 2000
                - type: number
                - type: boolean
                - type: 'null'
          required:
          - object_type
          - stage
          - conditions
          additionalProperties: false
        output_types:
          type: array
          items:
            type: string
            enum:
            - answer
            - checkpoints
            - cases
          minItems: 1
          maxItems: 3
          uniqueItems: true
        limit:
          type: integer
          minimum: 1
          maximum: 20
        extensions:
          type: object
          maxProperties: 32
          propertyNames:
            pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_.]*$
          additionalProperties: true
      required:
      - request_id
      - project_id
      - scene_code
      - question
      - context
      - output_types
      - limit
      additionalProperties: false
    KnowledgeResponse:
      type: object
      properties:
        query_id: &id010
          type: string
          minLength: 1
          maxLength: 36
          format: uuid
        status:
          type: string
          enum:
          - answered
          - insufficient_evidence
          - degraded
        knowledge_release_id:
          anyOf:
          - *id010
          - type: 'null'
        answer_blocks:
          type: array
          items:
            type: object
            properties:
              text: &id012
                type: string
                minLength: 1
